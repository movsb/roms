- series:
    id: 21
    description: "如果只算 **SNK 官方推出的街机作品**，一共 **7 款**：\n\n| 顺序 | 中文名 | 年份 | 街机平台 |\n|---|---|---:|---|\n| 1 | 《合金弹头》 | 1996 | Neo Geo MVS |\n| 2 | 《合金弹头2》 | 1998 | Neo Geo MVS |\n| 3 | 《合金弹头X》 | 1999 | Neo Geo MVS |\n| 4 | 《合金弹头3》 | 2000 | Neo Geo MVS |\n| 5 | 《合金弹头4》 | 2002 | Neo Geo MVS |\n| 6 | 《合金弹头5》 | 2003 | Neo Geo MVS／专用 PCB |\n| 7 | 《合金弹头6》 | 2006 | Sammy Atomiswave |\n\n其中《合金弹头X》不是简单改名版，而是以《合金弹头2》为基础重新调整、增加武器和敌人并改善卡顿后的独立作品。\n\n街机 ROM 列表里还经常出现：\n\n- 《合金弹头4 Plus》：非官方盗版/改版\n- 《合金弹头5 Plus》：非官方盗版/改版\n- 《合金弹头6》Neo Geo 版：通常是以《合金弹头3》修改的盗版，并非官方第六代\n- `Decrypted`、`Fully Decrypted`：解密 ROM，不是新游戏\n- `set 2`、`earlier`、`revision`：不同批次或修订版\n- `AES/MVS`：家用机与街机运行模式，通常仍是同一游戏\n\n《合金弹头7》是 NDS 游戏，《合金弹头XX》最初是 PSP 游戏，都不是街机作品；`1st Mission` 和 `2nd Mission` 则是 Neo Geo Pocket Color 掌机作品。\n\n所以整理街机游戏时，官方主线保留 **1、2、X、3、4、5、6** 即可。前六个 Neo Geo 作品通常用 FBNeo；第六代采用 Atomiswave，通常需用 Flycast 等模拟器。[SNK 官方系列历史](https://www.snk-corp.co.jp/us/anniversary/metalslug30th/history/)"
