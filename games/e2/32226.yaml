  platform_id: 5
  description: Publisher Jaleco Entertainment steps back into the gaming arena with a bubble-popping puzzle game. The quirky title, which was developed by Runecraft Software, lets players choose a character from a selection of five dancing DJs and selecting a skill level, players jump immediately into the guts of the game. The point is to maneuver the selected DJ from left to right and shoot bubbles at their colored counterparts as they slowly advance across a nine-by-nine grid. It's fairly simple stuff, but it is made slightly more complicated as three matching bubbles, be them in horizontal or vertical form, cancel each other out, award players points, and help clear the battlefield.
