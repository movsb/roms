  description: |-
    Risk it all in live casino action! Check into your favorite hotel, meet up with friends in the lobby, and you're ready to go!
    Place your bets! Blackjack, Slots, Roulette, Craps and Seven Card Stud poker promise fame and fortune. Parlay your stakes into a serious bankroll and shoot for the $10 million goal!
    Your companion will give you odds, advice and rules. Even beginners can master these realistic casino games. Put your money on the line and trust Lady Luck. It's an all-or-nothing ride to Vegas!
