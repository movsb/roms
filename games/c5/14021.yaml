game:
  id: 14021
  platform_id: 2
  description: "[重装机兵 - METAL MAX](https://metalmax.wikidot.com/)\n\n在 FC 语境里，“机甲战士”和“重装机兵”基本是同一款游戏——日本 Data East 1991 年的《Metal Max》初代，不是前后作关系。\n\n它们的关系是：\n\n- 日文原名：`Metal Max`\n- 大陆常用译名：`重装机兵`\n- 另一种早期盗版汉化标题：`机甲战士`\n- ROM 集中的 `Ji Jia Zhan Shi (Ch)` 就是“机甲战士”的拼音\n\n两种中文版主要来自同一套早期汉化传播链。先锋卡通完成汉化后，ROM 经不同盗版厂商、卡带版本继续修改和发行，于是出现了不同标题画面和若干程序、文字修订。相关资料指出，“机甲战士版”标题画面甚至把 `PUSH START` 错写成了 `PUSR START`，但游戏主体仍然是《Metal Max》。[版本异同说明](https://metalmax.wikidot.com/)\n\n所以在 gm 的组织方式里：\n\n- “机甲战士”和“重装机兵”应归入同一个游戏。\n- 不同 ROM 可以作为不同发行版保留。\n- `机甲战士`、`Ji Jia Zhan Shi` 应作为游戏或发行版的别名。\n- 不要与欧美的 `MechWarrior`（也常译“机甲战士”）混淆。\n\n这也解释了为什么游戏 14021 同时存在 `Ji Jia Zhan Shi` 和“重装机兵”名称：这种归并方向是正确的。大陆还曾使用“最强装甲”等译名，而港台更常称“坦克战记”。[重装机兵专题站](https://www.zzjb.com/about)"
