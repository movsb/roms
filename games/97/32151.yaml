  description: "Welcome to the whimsical world of Sitting Ducks, where life is good, food's a plenty, and alligators are lurking in neighboring Swampwood. One bird stands out amongst the flock: Bill. He is a quirky, smaller than average duck with a big imagination and a secret fun loving side. Along with his alligator friend Aldo, Bill embarks on 20 different missions in this whimsical action game. Play as Bill the Duck and Aldo the Alligator from the TV series and explore colorful and detailed levels."
