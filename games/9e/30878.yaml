  description: Game Boy Gallery is a Game Boy video game released exclusively in Europe in 1995. The game includes five classic Game & Watch video games with enhanced graphics and sound (if the player wishes, he or she can choose an option that lets them listen to the original sounds of the Game & Watch games). The gameplay has also been slightly altered. The games that were included are Ball, Vermin, Flagman, Manhole, and Mario's Cement Factory (for information on each individual game, check their page). The game was succeeded by Game & Watch Gallery, which included Game & Watch games and remakes with Mario characters.
