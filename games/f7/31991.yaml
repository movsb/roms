  description: Players help their favorite characters from the popular Disney Channel series save a town overrun with the mischievous pets from the future – "The Blahs". As Phil, Keeley or Curtis, players collect and assemble more than 20 futuristic gadgets to solve puzzles, overcome obstacles and capture the blahs to save the day. With several mini-games and unlockable features, "Phil of the Future" offers players hours of fun.
