game:
  id: 32333
  platform_id: 5
  description: ULTIMATE SPIDER-MAN is Activision's third SPIDER-MAN game and the first to be based off the comics rather than the new movies. The GBA game puts players in control of the web-slinging Spider-Man as he does battle with Venom and other enemies while getting help from some familiar superheroes. The story of Spider-Man begins when 15 year old Peter Parker is bitten by a radioactive spider. He soon realizes he has the ability to climb walls and to sense things. Shortly after being bitten, Peter and friend Eddie Brock discover a mysterious black suit that their fathers created before their deaths. Eddie ends up putting on the suit, which turns him into the powerful villain known as Venom. Peter must battle his childhood friend and other villains like the Green Goblin, Carnage, and Electro to save the city. In story mode, players can walk around New York City as much as they wish as they accomplish side-missions or move the plot along. Instead of walking, though, Spider-Man can shoot webs onto tall buildings and swing his way around the city while capturing gang members and stopping crimes. He also must stop Venom's plot and defeat the other villains. Players will also enjoy seeing Spider-Man joined by allies like Wolverine and the Human Torch for some scenes. Fans of the comics will enjoy how ULTIMATE SPIDER-MAN draws on the comic style and storyline, while movie fans will like getting to see another chapter in the Spider-Man legacy.
