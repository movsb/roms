  description: Open Season is a riotous romp in the great outdoors, where the rowdy brood of forest animals turns the tables on a bunch of unsuspecting hunters. When a domesticated grizzly named Boog gets lured into leaving the creature comforts of home by a fast-talking mule deer named Elliot, he finds himself lost in the woods just three days before hunting season. Forced to "rough it" in the great outdoors, Boog goes native, rallying all the forest animals to take back their home and send the hunters packing. The Open Season video game allows players to relive the movie experience by playing as Boog and Elliot. Throw skunk bombs, hurl rabbits, use acorn-firing squirrels and pull outrageous woodland pranks to scare the pants off the hunters in this action-adventure romp through the forest.
