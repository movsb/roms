  description: |-
    The sinister Lex Luthor is at it again! With his powerful weapon, the LEXOSKEL-5000, he'll stop at nothing to destroy the Man of Steel and take control of Metropolis. But now, you as Superman must come to the rescue in a battle against evil spanning land, air and sea. Take on the mysterious Shadow Walkers, battle the menacing extra terrestrial, The Preserver, escape heavy artillery fire and defeat the LEXOSKEL-5000 before Lex Luthor's plan condemns Metropolis forever!
    * Features 10 exciting levels of action on land, air and sea.
    * Take on dozens of powerful adversaries led by Superman's nemesis Lex Luthor.
