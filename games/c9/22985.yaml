- release:
    id: 22995
    game_id: 22985
    description: "**23035 是美版 PRG1（Rev A），属于 22995 美版 PRG0 的官方修正版。**\n\n实际 ROM 对比：\n\n| 区域 | 差异 |\n|---|---|\n| 文件头 | 完全相同 |\n| 程序／数据区 | 8,172 字节不同 |\n| 图形区 | 完全相同 |\n\n反汇编项目记录了两项实际修复：\n\n- **修复 4-3 Boss 战卡关**：PRG0 中，玩家受伤缩小时击杀小火球，可能未计入击杀数量，导致出口永远不出现。PRG1 修正了死亡处理。\n- **修复奖励抽奖画面偶尔不显示**：在 PAL 主机上，特定中断时机会导致画面不可见；PRG1 增加等待中断周期的处理。[修订说明与代码](https://github.com/Xkeeper0/smb2/blob/master/config.asm)\n\n所以普通画面和玩法基本一致，**日常游玩优先选 23035**。8,172 个不同字节包含代码移动产生的差异，不代表有这么多项改动。"
    release_type: 1
  names:
