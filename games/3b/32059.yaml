  description: "Grab your tackle box, launch the bass boat and let's go! Rapala Pro Fishing sets the standard for all fishing games. According to the publisher, never before has a fishing game brought you all the: authentic Rapala fishing gear, guided fishing trips with Rapala's Pro Staff and a boatload of action. Time to set the hook and land that trophy of a lifetime. The game's realistic fish detail with advanced AI, including bass, pike, walleye, salmon, catfish, muskie, trout, and many more. Rapala Pro Fishing features 21 tournaments, over 500,000 specially-selected acres of the world's finest trophy waters, guided trips led by Rapala's Pro Staff, and some special unlockable levels like the Amazon River and the Danube Delta."
