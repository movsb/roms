- release:
    id: 29735
    game_id: 29732
    description: "`29732` 和 `29735` 基本是同一个游戏，游戏逻辑完全相同。\n\n- `29732`\n  - `Kage (J) [!].nes`\n  - CRC32：`b2047d03`\n  - `[!]` 表示经过 GoodNES 验证的标准日版\n  - 数据库名称：日版\n\n- `29735`\n  - 压缩包内为 `赤影战士.nes`\n  - CRC32：`a756a212`\n  - 属于经过轻微修改的版本\n\n字节比较结果：\n\n- ROM 容量完全相同：262,160 字节\n- PRG 程序区：完全一致\n- CHR 图形区：只有 48 个字节不同\n- NES 头：1 个字节不同\n  - `29732`：水平镜像\n  - `29735`：垂直镜像\n\n因此，二者没有关卡、人物、难度或游戏机制上的区别。`29735` 只是调整了镜像标志，并零星修改了少量图形像素；实际游玩时很难看出差异，也不能算独立版本。\n\n建议：\n\n- 保留 `29732` 作为标准日版\n- `29735` 可标为“修改版”或直接合并/删除\n- 不宜把 `29735` 的主要名称简单写成“赤影战士”，否则看起来像正式中文版或另一发行版。\n\nScreenScraper 收录了完全相同的 ROM：\n\n- 文件名：`0010赤影战士(水上魂斗罗).nes`\n- CRC32：`A756A212`\n- MD5：`9FA464C22E19BF9AB2E0AF86A2D5C181`\n- SHA1：`DC4DC8894AF9D30491CA6B9A2F084989581612C7`\n\n这些校验值与 `29735` 完全吻合。不过 ScreenScraper 将其列为 `#NONGAME`，没有关联到正式游戏，也没有地区、版本、制作者等资料。[ScreenScraper ROM 记录](https://www.screenscraper.fr/romsinfos.php?alpha=0&numpage=0&plateforme=3)\n\n另外，一套网上流传的“小霸王 904 款游戏合集”确实包含：\n\n- `赤影战士(水上魂斗罗).nes`\n- `赤影战士.nes`\n- 各种汉化、无敌及加强版\n\n但页面没有公布每个文件的校验值，所以只能确认同名文件广泛流传，不能单凭名称证明就是同一个文件。[904 款游戏清单](https://v2fy.com/p/kr-000041/)\n\n我的判断是：`29735` 是中文 ROM 合集整理者制作或传播的轻微损坏/修改副本，编号 `0010` 也明显是合集排序编号。它没有程序修改，只有 48 个图形字节和镜像头不同，不像有明确目的的汉化版或加强版。\n\n建议将其标为：\n\n> 赤影战士（水上魂斗罗）（中文合集修改版）\n\n或者更保守：\n\n> 赤影战士（CRC A756A212，来源不明修改版）\n\n不建议继续用无修饰的“赤影战士”作为主要发行版名称。"
    release_type: 3
