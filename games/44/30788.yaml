  description: Eliminate bouncing balls in destinations around the world in Buster Bros. for Game Boy. Based on the 1989 arcade game, Buster Bros. has you guiding a pith helmet clad sibling in 50 levels across 17 cities. Aim a harpoon, grappling hook, or gun at each ball. A successful hit results in the sphere splitting into two or more targets, and play continues until all balls are removed from the screen. Avoid contact with the spheres by moving left and right, and collect assorted power-ups to help complete each stage. Two Game Boy owners can engage in cooperative play via Game Link Cable
