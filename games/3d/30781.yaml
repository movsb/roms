  description: "Defeat droves of dive bombing penguins! Squash squadrons of flying pigs! Trash tons of turbo-powered sheep!\nIt's all waiting for you in this wacky, whirlwind adventure through the Amazatorium.\n\nThree wild worlds, two mind-boggling mini-games, and one totally cool bobcat named Bubsy!\n\n- Nine fabulous, fur-flyin' levels\n- About a bazillion barnyard bad guys including Oinker P. Hamm\n- Mega-cool mini-games such as Frogapult (the ultimate in amphibian fun) and Liquid Lunacy (super duper deep sea silliness)\n- Great graphics and awesome animations"
