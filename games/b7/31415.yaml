  description: "Cartoon Network Block Party is a party game for Game Boy Advance that enables up to four players to compete \"party style\" on boards themed to a specific Cartoon Network show, including Johnny Bravo, Ed, Edd 'n Eddy, Courage the Cowardly Dog and Cow and Chicken. It features 14 unique mini-games including: Grand Prix, Strike a Pose, Greased Porkbutts, Backyard Boogie, and Skatin' the U. Published by Majesco, Cartoon Network Block Party was programmed by John Romero's Monkeystone development group"
