  description: "Handheld racer, features a smooth framerate for great controllability and a strong sense of speed. Cars are based on physical model settings: tires, aero, gearbox, and brakes. The developers endowed the machines with accurate characteristics for gears, max speed, rpm max, and engine curves. Thanks to the official FIA license, players will find 17 real circuits, 11 teams and 22 official drivers. The game also features race incidents (crashes, withdrawals, engine breakdowns, real-time broken records), an audio engine simulating up to 4 engines at the same time (gears, power, Doppler effects), and two difficulty settings. Players can modify car assistance and other pilots' skills and speed and choose from four game modes: Race, Season 2002, Custom Championship and Multiplayer."
