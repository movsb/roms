- release:
    id: 29814
    game_id: 22594
    description: "去掉文件头后的 CRC32 为 `9A2DB086`、SHA-1 为 `0C4992FC…`，与数据库收录的欧洲 Rev A 完全一致，PRG 校验也一致。因此它归为官方原版有了二进制依据。[NES Directory 记录](https://nesdir.github.io/9A2DB086_Europe.html)\n\n欧洲版与日美版的具体差异包括：\n\n| 项目 | 欧洲版的变化 |\n|---|---|\n| 敌人碰撞 | 栗宝宝、刺刺龟、食人花等部分敌人的碰撞框增加 1 像素 |\n| 水下出口 | 出口水管上方增加地形块，避免马力欧卡进右侧墙壁 |\n| 8-2 关 | 前两只飞行龟的初始位置分别向左、向右移动一格 |\n| 水下鱿鱼 | 最低位置下降 4 像素，可以碰到站在地面的大马力欧／火焰马力欧 |\n| 金币音效 | 第二个音调不同 |\n| 城堡过关 | 拿到斧头后的镜头滚动与马力欧步速不同步，可能导致他碰到屏幕右边缘 |\n\n这些变化见 [Mario Wiki 的地区差异记录](https://www.mariowiki.com/Super_Mario_Bros.#Regional_differences)。\n"
    release_type: 1
