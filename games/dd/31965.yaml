  description: For the first time ever, a true collaboration of popular Nickelodeon heroes and villains come together and cross over into multiple Nickelodeon cartoon environments, interacting with each other and working together to solve puzzles in this ultimate Nick gaming adventure. Playable characters from the most popular Nickelodeon shows include SpongeBob SquarePants, The Fairly OddParents, team Rocket Power, Jimmy Neutron and Tak. Nicktoons also marks the videogame debut of new Nickelodeon properties Danny Phantom and Rugrats All Grown Up.
