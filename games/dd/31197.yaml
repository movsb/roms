  description: "Everyones favorite block-blasting puzzler returns in TETRIS 2 for the Game Boy. This sequel to the world-famous TETRIS adds a few new wrinkles to the classic formula. First and foremost is the addition of color to the block-matching festivities. Now youll have to pay attention to the color of the shapes as well as where you put them! Your primary goal in TETRIS 2 is to clear out the play area of the different colored flashing \"bomb\" blocks. The game includes three different gameplay modes: Normal mode has you clearing out each stage with a never-ending supply of blocks; in Puzzle mode, youre challenged to clear out the stage with a specific number of blocks; and theres also a Head-to-Head mode, where you can play against a human or computer opponent in a battle to the finish."
