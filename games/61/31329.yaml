  platform_id: 5
  description: Create the baseball team of your dreams! It's great baseball action with the backyard kids and real pro players as kids. Pick your team, choose logos and playing fields. Play single games, an entire season or Home Run Derby. It's the chance of a lifetime to play with the pros right in your own backyard. Play single Games or a whole season, choose from all 30 Major League Baseball teams, create, save and trade custom players, practice your swing in the Home Run Derby, and track player and team stats in Season play. Also features a two-player multiplayer mode when linking up two Game Boy Advance units via a link cable.
