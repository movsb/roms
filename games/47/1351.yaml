game:
  id: 1351
  platform_id: 1
  description: "如果你说的是街机游戏，那么“电精”和“电神魔鬼”通常指的是同一款游戏，但正确标题是：\n\n- 日文正式名：**電神魔傀**\n- 罗马字/英文名：**Denjin Makai**\n- 中文常用简称：**电精**\n- “电神魔鬼”：属于误写，应为“电神魔傀”\n\n不过需要区分 SFC 版：\n\n- 街机版：**电神魔傀**\n- SFC 改编版：**Ghost Chaser 电精（ゴーストチェイサー電精）**\n\nSFC 版是街机版的改编移植，角色从 6 人减到 3 人，关卡和系统也有调整，所以最好作为不同发行版处理，不应当视为完全相同的 ROM。[资料说明](https://w.atwiki.jp/gcmatome/pages/1849.html)\n\n另外，续作是 **Guardians / 电神魔傀Ⅱ**，国内通常称“电精2”。"
