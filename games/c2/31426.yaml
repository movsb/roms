  description: Catwoman follows the tale of Patience Phillips, a shy office peon in the Hedare corporate empire. She accidentally discovers her employers' dark secret and is subsequently murdered. However, death will not stop Patience from seeking vengeance. Our heroine is brought back to life by a magical Egyptian cat. Patience soon discovers that along with her restored life, she has received several "cat powers" that will enable her revenge. Thus, Catwoman is born.
