  description: "The clock ticks down. The roar of the crowd rises in a deafening chant of \"U-S-A! U-S-A!\" Suddenly, your winger breaks free, and spots the open man in the middle. Pass... shot... GOAL! It's America's favorite new sport, soon to become your favorite new home video game, thanks to Jaleco! Because GOAL! brings soccer to life like you've never seen it. You play with a full team of 11 players, each one rated in 7 different skill categories. You can match them against a team controlled by the computer or another player. You can even team up with a friend and match your combined skills against the best computer team. So if you want soccer at its best, tune in to the undisputed champion of home soccer software: GOAL!"
