  description: Spirou, a journalist, and his friend Fantasio visit New York for an international conference of scientific research. When the pair arrives at the conference, Count Champignac, their long-time friend and one of the inventors at the conference, has disappeared. It turns out that Cyanide, a robot and one of Spirou's long time enemies, has kidnapped the count. With Count Champignac's inventions, Cyanide's intention is to make robots rule the earth and make all humans into slaves. While Spirou tries to save Champignac and stop Cyanida, Fantasio gathers intel in order to help Spirou.
