  description: Now you can play the best games that Las Vegas, Atlantic City, and New Orleans have to offer right in the palm of your hand. In World Championship Poker, you can visit a variety of casinos to play games such as poker, blackjack, video poker, and slots. Although your AI-controlled opponents are tough, each one has a unique set of "tells" that give you more information about the cards he or she is holding. Win money in single-player matches or challenge up to three of your friends via a Game Boy Advance link cable.
