  description: DuckTales (わんぱくダック夢冒険 Wanpaku Dakku Yume Bōken?, lit. "Naughty Ducks Dream Adventures") is an action platformer video game developed and published by Capcom and based on the Disney animated TV series of the same name. It was first released in North America for the Nintendo Entertainment System in 1989 and was later ported to the Game Boy in 1990. The story involves Scrooge McDuck traveling around the globe collecting treasure and outwitting his rival Flintheart Glomgold to become the world's richest duck.
