  description: "A long time ago, in a galaxy far, far away... a small, courageous group of rebels are fighting to restore freedom in the galaxy. Be Luke Skywalker, striking your first deadly blow against the evil Empire. Or Han Solo, veteran space pilot, sometime smuggler, and unlikely hero. Or brave Princess Leia, who risked her life to steal the secret plans for the Death Star. Enlist the aid of Obi-Wan Kenobi, and the droids C-3PO and R2-D2. Explore all the incredible worlds of Star Wars - from the Tatooine desert, to Mos Eisley Cantina, to the treacherous trenches at the very heart of the Death Star. Only you can destroy the Death Star and save the Rebel Alliance... May the Force be with you!"
