  description: Blades of Steel differs from the professional game in the NHL in the late 1980s in that it has no offside rule, and its interpretation of penalties is somewhat unique. The game's officials only call two penalties. Players who lose a fistfight are penalized for two minutes, an abstract reworking of the five-minute offsetting majors normally assigned in the event of a fight. Should a fight break out in front of one team's net, then the player on offense gets a penalty shot. The penalty shot is administered in the style of a soccer penalty shot, in that the shooting player must stand on the blue line, instead of moving towards the goaltender. The game also recognizes icing infractions, with an appropriate game reset and faceoff in the liable team's zone.
