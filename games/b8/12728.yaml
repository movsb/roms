- release:
    id: 29560
    game_id: 12728
    description: "`29542` 是在 `29538` 汉化版基础上加入的“无敌＋全能力”修改版。\n\n两者：\n\n- 大小完全相同：163,856 字节\n- NES 头、Mapper 119、中文字库完全相同\n- 只有 **58 个字节不同**\n- 差异全部位于最后一个 PRG Bank\n- 汉化文字和图形没有变化\n\n核心修改发生在文件偏移 `0x1EBBD`：\n\n```asm\n29538 原代码：\nORA $7C\nORA $7D\n\n29542：\nJMP $FF62\nNOP\n```\n\n也就是跳到新增的作弊程序。新增程序位于 `0x1FF72`，对应 CPU 地址 `$FF62`：\n\n```asm\nLDA #$0F\nSTA $7C             ; 开启能力位\nORA $7C\nORA $7D\n\nLDA #$04\nSTA $78\nSTA $79             ; 两项数值固定为 4\n\nLDA #$D0\nSTA $90\nSTA $92\nSTA $93\nSTA $94\nSTA $96\nSTA $97\nSTA $98\nSTA $9A\nSTA $9B\nSTA $9C\nSTA $9E\nSTA $9F\n\nLDA #$D3\nSTA $91\nSTA $95\nSTA $99\nSTA $9D\n\nJMP $EBB1           ; 返回原程序\n```\n\n因此关系很明确：\n\n- asset `29538`：普通汉化版\n- asset `29542`：以 `29538` 为基础，只加入作弊代码的“无敌全能力汉化版”\n\n它们不是两个汉化版本，翻译内容相同。数据库目前把两者放在同一个发行版 `29560` 下；更合理的做法是拆成两个发行版，并把 `29542` 标记为“修改版/作弊版”。"
