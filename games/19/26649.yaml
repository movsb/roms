- release:
    id: 26649
    game_id: 26649
    description: "这两个资源都是《七宝奇谋 2》，但不是同一个 ROM：\n\n| 资源 | 实际版本 | CRC32 |\n|---|---|---|\n| 12474 | `Goonies II, The (USA)` 美版原版 | `aa9ca482` |\n| 26631 | `Goonies II, The (Europe) [t4]` 欧版 Trainer 4 | `31295a3e` |\n\n其中 `aa9ca482` 可确认是 No-Intro 的美版原版校验值。[Romhack Plaza 校验资料](https://romhackplaza.org/translations/the-goonies-ii-spanish-translation-nes/)  \n`(E) [t4]` 在旧 ROM 命名中表示“欧版、训练/作弊修改第 4 版”。[NES Ninja 版本列表](https://nesninja.com/game/nes/goonies-ii.the/roms)\n\n字节比较结果：\n\n- 文件大小相同：131,088 字节\n- iNES 头完全相同\n- 两者都是 128 KiB PRG、使用 CHR RAM\n- 共 15,486 个字节不同\n- 差异主要集中在最后一个 32 KiB 程序区\n- 因为一个以美版为基础，另一个以欧版为基础并附加 Trainer，所以差异远大于上一组资源\n\n虽然代码差异很多，但关卡、画面和主要玩法仍是同一款游戏；地区差异及 Trainer 功能不一定在短时间正常游玩中明显出现。\n\n数据库归类也是合理的：\n\n- 12474 属于发行版 12492：美版原版\n- 26631 属于发行版 26649：欧版 Trainer 4\n- 两者都已经位于游戏 26649 `Goonies 2 / 七宝奇谋2` 下\n\n建议保留两个发行版，但把发行版 26649 的名称从笼统的“七宝奇谋2”改成“Goonies II (Europe) [Trainer 4] / 七宝奇谋2（欧版，训练版4）”。"
