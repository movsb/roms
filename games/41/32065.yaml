game:
  id: 32065
  platform_id: 5
  description: Rayman 3 (Game Boy Advance) is a portable version of the console game of the same name which was released for the Game Boy Advance in 2003. It is the first handheld Rayman game to feature multiplayer modes which made use of the Game Boy Advance/GameCube link cable, to link to the GameCube version. It is a 2D side-scrolling game with elements from Rayman, Rayman 2, and Rayman 3, though it is mostly centered around the story of Rayman 2. It is thought that it was originally developed as a Game Boy Advance version of Rayman 2, and that its Rayman 3 elements were added late in its development so that it could be marketed as a Game Boy Advance version of Rayman 3.
