  description: If you think you're tough enough to rumble with the best fighters in the world, take your best shot in RAGING FIGHTER. Choose from seven different brawlers Vandal, Aska, Ruoh, Shades, Miyabi, Tao, and Bulk as you take it to the competition and show em who's boss. There are four different tournament styles to play in, making for intensely high replay value and variety. Each of the seven fighters brandishes a few special moves that are all their own, making for original fights every time out. Of course, there are the requisite punches and kicks, but mastering your own fighter's combos will lead you to easier victory. Play against the computer, or hook up with a friend via a link cable and scrap it out for bragging rights.
