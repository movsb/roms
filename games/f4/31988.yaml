game:
  id: 31988
  platform_id: 5
  description: "Petz Vet introduces players to life as a veterinarian, diagnosing and treating 35 different medical cases. Being a vet is always an interesting occupation, as you quickly learn while taking care of a dog with a broken leg, a bunny with a stomach ache, a cat with asthma, a sunburned frog, a bird with - who knows? Do you know what happens when a dog accidentally swallows aspirin? You'll learn, when you assume the role of veterinarian in this busy animal hospital. In addition to taking care of the animals' medical needs, you can also perform some basic caretaking functions, such as washing and grooming your pet."
