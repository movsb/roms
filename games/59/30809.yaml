  description: You and your best girl were floating happily in the vast void of space. Suddenly, the Big Bang occurs, separating the two of you. It's up to you to travel through time to find her. Before this can happen, you must go though a number of levels collecting items. However, the items must be collected in the proper order, and you will face a number of obstacles including piranhas, pterodactyls, rats, and birds. Keep bouncing and stay focused on the goal to be reuniting with you girlfriend in COOL BALL.
