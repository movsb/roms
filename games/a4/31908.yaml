  platform_id: 5
  description: "Those wacky Mighty Beanz have jumped out of your pocket and invaded the Game Boy Advance. Now they have split apart and are all mixed up! You have to help them become whole again by matching the right top with the bottom. The game sports fast-paced puzzles starring all your favorite Mighty Beanz. Use special power-ups to send your opponent's Beanz spinning and unlock rare and super pro Beanz and wager them in Battle Mode. Each package contains one Majesco Gamer Bean -- collect all five, including the Limited Edition CHAMP Gamer Bean."
