game:
  id: 29092
  platform_id: 2
  description: "“特救指令”的完整标准名称是：\n\n**《特救指令 Solbrain》**  \n日文：**特救指令ソルブレイン**  \n罗马字：**Tokkyū Shirei Solbrain**\n\n它是 Natsume 开发、根据东映同名特摄剧改编的 FC 动作游戏。中文游戏库中通常简称 **《特救指令》**，这个名称没有问题；若要写全，可用 **《特救指令：索尔布雷恩》**。\n\n它的欧美版更换了授权角色和故事，名称变为：\n\n**Shatterhand**\n\n两版主体玩法相同，但并非只换标题：\n\n- 主角、敌人和剧情画面不同\n- 日版有游乐园关卡，欧美版换成核潜艇关卡\n- 部分音乐、Boss位置和难度有所区别\n\n整理 ROM 时建议分别命名：\n\n- `Tokkyuu Shirei Solbrain (Japan)` → **特救指令（日版）**\n- `Shatterhand (USA/Europe)` → **Shatterhand（欧美版）**\n\n如果希望全部采用中文，也可把后者写成 **《碎击战士》**，不建议直接把两版都当成完全相同的《特救指令》。"
  series_id: 0
