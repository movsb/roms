  description: |-
    Pocket Bomberman (ポケットボンバーマン Poketto Bonbāman?) is a platforming action game first released for the Game Boy in 1997, and later as a launch title for the Game Boy Color in 1998.
    
    Pocket Bomberman features gameplay that revolves around using bombs to box in enemies and blowing them to bits. Once all enemies are defeated, Bomberman has to go to the door at the end of the stage to complete the level. There is a total of 5 worlds and 25 levels. These worlds include a jungle world, an ocean world, a wind world, a cloud world, and a world with the name of "Evil". Each world has a boss fight at the end in which Bomberman must expose the boss's weak points and bomb the boss until it has no health left.
