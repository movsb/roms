    description: "**两者基于同一份汉化，但 28333（拉格朗日点汉化版.zip） 另外做了修改，并非重复 ROM。**\n\n- 大小均为 **1,048,592 字节**，文件头完全相同。\n- 都包含相同的 `ZENG GE JIANG GE / CN VER` 汉化署名。\n- 全文件仅 **86 字节不同**，集中在 11 处。\n\n其中比较明显的修改：\n\n| 位置 | 28333 的变化 |\n|---|---|\n| `0x3EC1D–0x3EC24` | 四个数值被统一改成 **9999** |\n| `0x42F47`、`0x42F50` | 将原来的加法指令改为直接赋固定值 |\n| `0x7DEA0–0x7DEDD` | 在原空白区域加入 62 字节代码 |\n\n这些特征**更像基于汉化版制作的数值强化／作弊版**，而非单纯汉化修正。但 9999 对应金钱、能力还是其他参数，尚未定位，不能直接下结论。\n\n建议 **28332 保留为汉化版，28333 暂标“汉化修改版（具体效果待核验）”**，先不合并。"
