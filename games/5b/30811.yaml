game:
  id: 30811
  platform_id: 4
  description: A single-player platformer in which the player controls Cool Spot, who can jump, and attack by firing soda bubbles, which could be shot in all directions and while jumping. Cool Spot could also cling to and climb various things by jumping up in front of them. In each level the player must rescue other cool spots, who look exactly alike, from cages at the end of that level, which is not necessarily the point at the far right of the level map. In order to do so, the player is required to collect a certain number of "spots" that would change (usually increase) as the game progressed. "Spots" were placed across the level in large quantities, and were the game's substitute for items such as the coins in Super Mario Bros or Sonic the Hedgehog's gold rings (these were often used in this style of game, mostly for points and extra lives).
