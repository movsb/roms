  description: As the loveable can-do star, Stuart, players run, dodge, drive, skateboard, jump and fly in an action packed platform adventure game. The title follows the storyline from the film and challenges players to solve the disappearances of Stuart?s new best friend, Margalo, and Mrs. Little's wedding ring. Activities include competing in racing levels, taking on challenging foes, piloting a plane and riding helium balloons through 10 varied levels. The game also allows players to go head to head as either Stuart or Margalo via the Game Boy Advance Game Link Cable in challenging racing action.
