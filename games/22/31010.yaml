  description: The object of Mr. Do! is to score as many points as possible by digging tunnels through the ground and collecting cherries. The title character, Mr. Do (a circus clown), is constantly chased by red monsters resembling small dinosaurs, and the player loses a life if Mr. Do is caught by one. The game is over when the last life is lost.
