  description: 4-in-1 Fun Pak combines four board games to play against the CPU or a fellow gamer. The include titles are Chess, Checkers, Reversi and Backgammon. Each game features a number of different difficulty settings (1 being the easiest, 6 being the hardest), with simple black and white visuals and a challenging CPU opponent to take on. Multiplayer is available, either using the same Nintendo Game Boy between two players or using the system link option to play with two Nintendo Game Boys.
