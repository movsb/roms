  description: "Jump aboard your Personal Water Craft and hit the waves! Pick one of three versatile PWC's - the nimble 550cc, the speedy 650cc, or the high-powered 800cc National Class racer. Splash your way through 8 tracks in the racing circuit, or compete in 8 different breakneck slalom courses. Watch the spray fly as you leave your opponents swamped in your wake! Save your quickest lap and course times. Race to top your fastest speed, or challenge up to three of your friends with the Four Player Adapter and pour on the power!"
