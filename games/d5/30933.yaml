  description: "From power hiting to playing awesome defense, \"The Kid\" can do it all! Now, you can too, with KEN GRIFFEY JR. PRESENTS MAJOR LEAGUE BASEBALL®! Hundreds of unique characters from your favorite teams are here-- the very best Major League Baseball has to offer!\nDive or leap to make the catch! Jump over the hard slide of the lead runner, pivot and fire to first for a rally-killing double play! Feel the pain when you slam into the outfield fence and rob your opponent of extra bases! Do you have what it takes to play ball with \"The Kid\"?"
