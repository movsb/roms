  description: Palamedes is a puzzle game requiring the player to match the dice they are holding to the dice at the top of the screen. Using the "B" button, the player can change the number on his/her dice, then throw the dice using the "A" button when it matches the dice at the top of the screen, which wipes the target dice off the screen. The player can play in "solitaire" mode against the computer or another player, or "tournament" mode against AI opponents. There are six sides and numbers on the dice, making an attempt to match all the numbers on the screen and eliminating them a challenge.
