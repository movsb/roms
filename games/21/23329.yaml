game:
  id: 23329
  platform_id: 2
  description: "不是同一款游戏，应该作为两个独立游戏保存。\n\n- **Spy Hunter（间谍猎人）**\n  - 原作是 Bally Midway 1983 年的街机游戏\n  - FC/NES 版由 Sunsoft 移植，1987 年在美国发行\n  - 属于原作的家用机移植版\n\n- **Super Spy Hunter（超级间谍猎人）**\n  - 1991 年首先在日本发行\n  - 日版正式名称是 **Battle Formula（バトルフォーミュラ，战斗方程式）**\n  - 欧美版取得了《Spy Hunter》授权，改名为 **Super Spy Hunter**\n  - 日本版和欧美版是同一款游戏的地区发行版，应当合并在一个游戏下\n\n关系比较特殊：欧美市场把 `Super Spy Hunter` 包装成《间谍猎人》的续作，但它最初是 Sunsoft 独立开发的 `Battle Formula`，并非为 Bally Midway 原作直接制作的正统续集。[GameFAQs 发行资料](https://gamefaqs.gamespot.com/nes/563466-super-spy-hunter/data)\n\n因此数据库建议：\n\n```text\n游戏一：Spy Hunter\n  └─ FC/NES 美版等发行版\n\n游戏二：Battle Formula / Super Spy Hunter\n  ├─ Battle Formula（日版）\n  ├─ Super Spy Hunter（美版）\n  └─ Super Spy Hunter（欧版等）\n```\n\n它们可以同时归入“Spy Hunter／间谍猎人”系列，但不要合并成同一个游戏。"
