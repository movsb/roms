  description: The gameplay of Snow Bros. is similar to Bubble Bobble, released in 1986. The game supports up to two players, with each player taking the part of one of two snowmen Nick and Tom. Each player can throw snow at the enemies. The player must throw snow at each enemy until it is completely covered, when it turns into a snowball. An enemy partially covered in snow cannot move until it shakes it off.
