  description: Help Turbo Turtle win his freedom to once again swim the sea. Trapped on the 'Isle of Mazes' you must guide Turbo Turtle through deceitful labyrinths and nasty traps. Collect keys to unlock doorways, avoid the super magnets and utilize the turbo boost feature to try and beat your fastest time. This innovative title blends the basic balancing act of Super Monkey Ball with the mind-bending key-and-switch puzzles found in the Zelda games.
