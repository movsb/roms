  description: In the year 3025, the peaceful planets of The Associated Nexus of Galaxies (TANG) is threatened by hordes of invaders bent on pillaging the natural resource of Energy Crystals. Their attack is quick and precise; the planets are almost completely overrun by these savage aliens. The TANG, now backed into a corner, initiate their last line of defense. They call upon four super dimensional cyborg heroes. Called Tangibles for their ability to conjure up solid blocks out of thin air, these brave soldiers will use their cunning, quick reflexes and Power Bolts to retrieve the Energy Crystals and push back the advancing armada.
