  description: In NHL 2002, Electronic Arts has included several game modes including Practice, Exhibition and a Full Season. You can even pull off one-timers and blocked shots in a head to head match, with up to four players. Multiplayer action requires GBAs and Game Paks for every player and enough GBA Game Link cables to connect all systems. NHL 2002 allows anyone to play like a pro make the first hockey game on the Game Boy Advance enjoyable.
