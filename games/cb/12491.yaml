- release:
    id: 9101
    game_id: 12491
    description: "| 资源 | 文件 | CRC32 | 性质 |\n|---|---|---|---|\n| 9083 | `Contra 6 (Goonies Hack).nes` | `043660b7` | 《七宝奇谋》的轻微作弊改版 |\n| 12473 | `Goonies (Japan).nes` | `5589af04` | 日版原版；校验值与 No-Intro 记录一致。[校验资料](https://rhdn-archive.romhackplaza.org/?offset=5500&type=translations) |\n\n字节级比较结果：\n\n- 文件大小相同：49,168 字节\n- iNES 头完全相同\n- 图形 CHR 区域完全相同\n- 只有 PRG 程序区的 35 个字节不同\n- 差异集中在 5 个很小的区域\n- 改版把至少两条“递减数值”的 6502 指令替换成只读取、不递减：\n  - `DEC $46` → `LDA $46`\n  - `DEC $05F2` → `LDA $05F2`\n- ROM 尾部还插入了一段 11 字节的小程序\n\n这类修改通常用于无限生命、无限物品或其他 Trainer 作弊，不会改变关卡、人物图形、音乐或标题画面。因此你看到的仍然是《七宝奇谋》，基本不会出现《魂斗罗》的内容。\n\n`Contra 6` 只是旧 ROM 集中的误导性盗版/改版名称；公开 ROM 列表也把它标为 `Contra 6 (Goonies Hack)`，而不是一款真正的《魂斗罗》游戏。[旧 ROM 列表记录](https://www.scribd.com/document/397983476/Lista-de-Juegos-Nes)\n\n目前数据库归类其实是正确的：两个资源都已位于游戏 12491 `Goonies / 七宝奇谋1` 下，只是不同发行版。建议将发行版 9101 改名为“七宝奇谋（Trainer/作弊改版）”，而不是删除或归入《魂斗罗》。"
