  description: THUNDER ALLEY for Game Boy Advance features characters first presented to the gaming community in TEN PIN ALLEY and TEN PIN ALLEY 2 available for Play Station 1 and Saturn systems. The stock car racing game comes loaded with tons of fast-paced action and entertaining tracks. Choose from eight different characters to blaze out on one of four diverting tracks. The game was created with the realistic laws of physics that are applied to real stock car racing to provide a realistic racing feel. The game offers a practice racing mode that allows players to get the feel for the basic controls including 'A' for accelerate and 'B' for brake. Tournament mode has players racing to earn points that are awarded based on the finishing position of each player's character. Every course has its own unique set of obstacles that can get in the way, but the player can drive over them with power ups. Power ups also provide the driver with improved steering and speed. If the player wins the game's final tournament, a secret play mode is unlocked and can be played by the winner. Fans of racing games including cart or other forms of transportation should give THUNDER ALLEY a try and won't be disappointed. In a game that offers fun graphics, sound effects, and tracks that can be played over and over again, this game guarantees hours of unique and endless entertainment.
