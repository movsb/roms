    description: "`dynwar` 和 `dynwara` 都是美版《Dynasty Wars》（即《吞食天地》街机一代），区别主要在基板版本和 ROM 组织：\n\n| ROM set | 地区 | CPS-1 B-Board | 特点 |\n|---|---|---|---|\n| `dynwar` | 美国 | 89624B 系列 | MAME 当前父集，采用较大容量 ROM |\n| `dynwara` | 美国 | 88622B-3 | 另一套基板，使用更多小容量 ROM |\n\n几乎没有差异，只有硬件存储结构上的不同。"
    release_date: 0
