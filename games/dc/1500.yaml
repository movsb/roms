game:
  id: 1500
  platform_id: 1
  description: "## 日文原版和再发行版\n\n两者都是日版《天地を喰らう》，主要区别是发行批次和硬件：\n\n| ROM 名 | MAME 标题 | 基板 | CPU |\n|---|---|---|---|\n| `dynwarj` | Tenchi wo Kurau (Japan) | 88622B-3 | 10 MHz |\n| `dynwarjr` | Tenchi wo Kurau (Japan Resale Ver.) | 91634B-2 | 12 MHz |\n\n`dynwarjr` 末尾的 `r` 表示 **Resale Version（再发行版）**。它采用较新的 CPS-1 B-Board，主程序 ROM 也不同；图像、声音等大量内容则与原版相同。12 MHz CPU 主要会减少复杂场面中的掉速，不宜简单理解为游戏整体快了 20%。\n"
  series_id: 22
