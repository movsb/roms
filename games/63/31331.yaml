  description: "For the first time ever, Backyard Basketball is on the Nintendo Game Boy Advance system! Create your own portable basketball team with Backyard Kids and cool kid versions of NBA stars. It's slam-dunk action full of wacky courts and crazy Backyard Basketball power-ups. Choose from 30 Backyard Kids and 10 kid versions of NBA stars including Tim Duncan, Tracy McGrady, Shaquille O'Neal, Kevin Garnett, Dirk Nowitzki, Vince Carter, Ray Allen, Paul Pierce, Yao Ming and LeBron James -- as well as all 30 teams, or choose Backyard Teams like the Hyper Hot Doggers and Jumpin' Gym Rats. Score some fast points with zany power-ups like Hot Hands and Super Speed on some really cool courts, like the beach, on the playground, or in the street. Choose Pick-Up games, Mini-Games, or an entire Backyard season and track player and team statistics in Season Play mode."
