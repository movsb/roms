  description: "Game Boy Advance multiplayer racing adventure game, released in Japan as Choro Q Advance 2. Road Trip: Shifting Gears continues the Takara-developed racing series on the GBA, and has the ability to link to Road Trip: Arcade Edition on the GameCube for unlockable extras. Players have full control over car customization, down to the most minute detail with a body paint shop, more than 100 different parts, and numerous fantasy attachments. Players compete in 150 racing events, minigames, in more than 64 courses. The game supports link cable connectivity for up to four players."
