  description: The game begins when the player selects Libya (much like Operation El Dorado Canyon), the Persian Gulf, or Vietnam as a mission theater. Play then begins from the cockpit of an F-15 already in flight and armed with a variety of missiles, bombs, drop tanks, flares and chaff. The player flies plane in combat to bomb various targets including a "primary" and "secondary" target while also engaging in air-to-air combat with enemy fighters. The game ends when either the player's plane is destroyed or when the player returns to base.
