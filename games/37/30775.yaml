  description: "Brain Drain is a puzzle game in which the player has to recreate a pattern, consisting of different symbols like apples or hearts, which is shown in the corner of the screen. The main playing field consists of said symbols, but randomly switched around. The player controls a frame which encloses four of the symbols. When pressing a button, the symbols are rotated clockwise around the frame. Of course the levels have to be solved within a time limit.\n\nIn the higher difficulty levels, the player also has to deal with so-called special effects which occasionally kick in during play, e.g. some symbols get hidden by \"?\" blocks, symbols rotate on their own or the controls are reversed. Three power-ups can be earned by completing bonus levels or finishing a level really fast: clock (stops time for 20 seconds), flash (skips the current level) and credit (gives a second try after time has run out). Clock and flash have to be activated manually; credits is applied automatically. Besides the regular playing mode, there is also the \"Brain Race\" available which involves solving a certain number of levels (depending on the difficulty) as fast as possible."
