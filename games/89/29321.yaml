- release:
    id: 9341
    game_id: 29321
    description: "6 个 PRG 差异实际上是三组两字节修改，而且正常版中的三处内容原本全部都是：\n\n```text\nE2 09\n```\n\n盗版版把它们改成：\n\n```text\n位置 1：00 00\n位置 2：00 00\n位置 3：01 00\n```\n\n具体位置：\n\n| 文件偏移 | PRG 偏移 | 正常版 | Pirate |\n|---:|---:|---|---|\n| `0x066D9` | `0x066C9` | `E2 09` | `00 00` |\n| `0x08E08` | `0x08DF8` | `E2 09` | `00 00` |\n| `0x15D3F` | `0x15D2F` | `E2 09` | `01 00` |\n\n全体 PRG 中恰好只有这三处 `E2 09`，Pirate 版把三处全部替换了，明显是一次有针对性的全局模式替换，不像随机读取错误。\n\n其中只有第二处位于可以可靠反汇编的 6502 程序代码中。\n\n正常版：\n\n```asm\nLDA ($18),Y\nBPL skip\nLDA $E2\nORA #$10\nSTA $E2\nskip:\nLDA $E3\nAND #$01\n```\n\nPirate 版：\n\n```asm\nLDA ($18),Y\nBPL skip\nLDA $00\nBRK          ; 后面的 $10 成为 BRK 的签名字节\nSTA $E2\nskip:\nLDA $E3\nAND #$01\n```\n\n实际变化是：\n\n```asm\n; 正常版\nLDA $E2\nORA #$10       ; 设置 $E2 的 bit 4\n\n; Pirate 版\nLDA $00\nBRK #$10       ; 触发软件中断\n```\n\n如果前面的 `BPL` 分支成立，这段差异会被完全跳过；只有分支不成立时才执行。因此正常游玩时可能很少触发，解释了 Pirate 版看起来基本相同。\n\n另外两处周围充满重复的 `09`、`0B`、`0F` 等字节，无法形成可信的 6502 指令流，更像压缩数据、脚本或查找表，不应强行反汇编。它们分别把同一个数据标记 `E2 09` 改成了 `00 00` 和 `01 00`。\n\n结论：这个 Pirate 版很可能用粗略的全局搜索替换修改了所有 `E2 09`。其中一处碰巧改变了真实程序逻辑，引入 `BRK` 软件中断；这可能是盗版卡带适配、保护绕过或特殊补丁机制，也可能带来某个罕见条件下的异常。它不是随机 bad dump，但修改方式很可疑。"
