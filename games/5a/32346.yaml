  description: Based on the hit TV series, the W.I.T.C.H GBA game transports you into the lives of the 5 fun loving girls, Will, Irma, Taranee, Cornelia and Hay Lin as they discover that they aren't your average teenage girls...The W.I.T.C.H girls are in fact all elemental Guardians entrusted with the protection of Earth from the evil Phobus, who is trying to conquer earth. The W.I.T.C.H game stays true to the TV series, whilst adding twists that are unique to the video game, including elements of teamwork, friendship, understanding and conflict all of which contribute to the rich back story of the W.I.T.C.H universe.
