game:
  id: 11713
  platform_id: 2
  description: |-
    1992 年推出，是系列第二作。国内盗版汉化版给它增加了 “索菲亚复苏” 这个非官方副标题，并以 《圣火徽章：索菲亚复苏》 的名字流传。
    
    最容易混乱的是：由于国内玩家先熟悉《索菲亚复苏》，一些盗版商后来竟把真正的第一作《暗黑龙与光之剑》标成了 《圣火徽章2》。所以盗版卡上的“2”并不代表官方序号。
