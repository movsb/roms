  description: "FC/Famicom/NES 上没有任天堂官方发行的《宝可梦／口袋妖怪》游戏。\n\n官方系列首作是1996年在 Game Boy 上发行的：\n- 《宝可梦 红》\n- 《宝可梦 绿》\n- 后续《宝可梦 蓝》《宝可梦 皮卡丘》\nFC 上流传的所谓：\n- 《口袋妖怪 黄》\n- 《口袋妖怪 金／银》\n- 《宠物小精灵》\n- 《皮卡丘》\n- Pokémon / Pocket Monster\n基本都是未经授权的盗版移植、改版、换皮或自制游戏，有些还是把其他 FC RPG 修改而成。"
