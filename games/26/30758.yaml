  description: |-
    SWING INTO ACTION AGAINST THE FORCES OF EVIL!
    
    A ruthless army stands ready for war and the one man who can stop it has disappeared. Now, in a desperate fight for survival, the world tums to an elite group of men and women to put an end to the threat. More than simple soldiers, they are the Bionic Commandoes. Drop behind the lines with Rad Spencer as he infiltrates the Doraize military stronghold. Blast your way through enemy lines with your assault rifle and gather the information needed to rescue Super Joe. Tap enemy communications to
    learn the dark secrets of director Wiseman and then come face to face with the awesome might of his mysterious Albatross Project!
