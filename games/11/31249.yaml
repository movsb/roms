  description: WordZap is a puzzle video game designed by Michael F.C. Crick, son of scientist Francis Crick. In 1991, it was included with Volume 3 of the Microsoft Entertainment Pack and was later released by Jaleco for the Game Boy in 1992. An updated version for newer editions of Microsoft Windows is available on the game's official website as shareware. The game has been compared with Scrabble and Boggle; in WordZap players "zap" letters in order to make proper English words.
