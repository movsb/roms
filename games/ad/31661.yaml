  description: Experience the thrill of high stakes gambling in the Golden Nugget Casino with classic games like Blackjack, Craps and Roulette, plus Slots and Video Poker. When you’re down on your luck, visit the ATM then hit the tables for more action. With Golden Nugget Casino, you can be a high roller and leave your wallet at home. Master a variety of card and table games plus slots and video poker and pull the lever on slot machine games including Halloween Spooky and Wild West. Challenge yourself on Video Poker games like Deuces Wild, Joker’s Wild, Jacks or Better and Tens or Better. Get a loan from the cashier of up to $2,000 at a time, up to a maximum of $10,000. Password system allows you to enter a password and resume play with a previously saved bank account balance.
