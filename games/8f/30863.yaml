  description: Long ago, the ancient gods possessed a powerful force called The Magi. But they later split it into 77 different pieces and scattered them throughout nine different worlds. You've been given one of those pieces. And now, along with your band of chosen warriors, you journey through each world searching for the rest of the pieces and your long-lost father. You face danger at every turn. But if you make the right decisions, you can conquer each world and recover all the pieces of The Magi. Get ready for a daunting adventure, filled with unexpected surprises and perils.
