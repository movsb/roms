- release:
    id: 30277
    game_id: 9103
    description: "**30277 是删去版权信息的修改版，9103 是完整美版。** 两张已有标题截图也印证了这一点：\n\n- **9103**：显示 `KONAMI` 标志、©1992 和任天堂授权文字。\n- **30277**：上述内容消失，只留下游戏 Logo 和“PUSH START BUTTON”。\n\n二进制差异：\n\n| 区域 | 差异 |\n|---|---|\n| 程序／数据区 | **80 字节被清零**，集中在 `0x1556B–0x156B3` |\n| 图形素材区 | 完全相同 |\n| 文件头 | 镜像标志相差 1 位 |\n| 文件末尾 | 30277 多出 128 字节，含 `CONTRA FORCE fer iNES by Acey` 转储署名 |\n\n结合截图，清零区域应是标题画面的布局／文字数据。**没有发现这些区域之外的游戏内容改动。**\n\n建议以 **9103 为原版主条目**；30277 应归为“改版”，可注明“去版权标题版”。"
